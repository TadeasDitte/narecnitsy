# Production stack only. For local development, use Laravel Sail instead
# (`php artisan sail:install`) - this file is not meant to be run side by
# side with it.
#
# The image is built and published to GHCR by .github/workflows/tests.yml
# (the `docker` job) on every push to main - this file only ever pulls, it
# never builds. That means `docker compose ... pull` needs to be
# authenticated against ghcr.io first if the package is private:
#   echo $GITHUB_TOKEN | docker login ghcr.io -u <github-username> --password-stdin
#
# Usage:
#   cp .env.example .env            # then fill in APP_KEY, DB_PASSWORD, etc.
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Markets/history are seeded automatically by the `seed` service below - no
# manual command needed after `up`. To re-run it later (e.g. after adding a
# symbol to HYPERLIQUID_SYMBOLS), either use the "Backfill all markets"
# button on the /market-data page, or:
#   docker compose -f docker-compose.prod.yml exec app php artisan hyperliquid:backfill --all
#
# To build+run from local source instead (e.g. testing a change before it's
# on main), use the plain Dockerfile directly - it has the same `app`
# target this image is built from.
#
# Topology: one image (nginx + php-fpm together, see Dockerfile) run five
# ways - `app` serves HTTP, `queue`/`hyperliquid-stream` are singleton
# background workers, `migrate` and `seed` each run once per deploy and gate
# the other three (postgres -> migrate -> seed -> app/queue/stream).

x-app: &app
    image: ${GHCR_IMAGE:-ghcr.io/tadeasditte/narecnitsy}:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
        APP_ENV: production
        # Must be the real public URL (e.g. https://narecnitsy.tadesrv.eu).
        # AppServiceProvider forces every generated URL (redirects included)
        # from this, since a reverse proxy that doesn't forward the original
        # Host header would otherwise leak whatever address actually reaches
        # this container into redirect Location headers.
        APP_URL: ${APP_URL:?set APP_URL in .env to your real public URL}
        LOG_CHANNEL: stderr # so `docker compose logs` shows Laravel's log output
        DB_CONNECTION: pgsql
        DB_HOST: postgres
        DB_PORT: 5432
        DB_DATABASE: ${DB_DATABASE:-narecnitsy}
        DB_USERNAME: ${DB_USERNAME:-narecnitsy}
        DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
        SESSION_DRIVER: database
        CACHE_STORE: database
        QUEUE_CONNECTION: database
        HYPERLIQUID_NETWORK: ${HYPERLIQUID_NETWORK:-mainnet}
        HYPERLIQUID_SYMBOLS: ${HYPERLIQUID_SYMBOLS:-BTC,ETH,SOL,ARB,AVAX}
    depends_on:
        seed:
            condition: service_completed_successfully
    restart: unless-stopped

services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-narecnitsy}
            POSTGRES_USER: ${DB_USERNAME:-narecnitsy}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-narecnitsy}']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    # Runs the migrations once, then exits. app/queue/hyperliquid-stream all
    # wait for this to finish successfully before they start.
    migrate:
        image: ${GHCR_IMAGE:-ghcr.io/tadeasditte/narecnitsy}:${IMAGE_TAG:-latest}
        env_file: .env
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE:-narecnitsy}
            DB_USERNAME: ${DB_USERNAME:-narecnitsy}
            DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
        # On a brand-new volume, Postgres's healthcheck can pass against its
        # transient initdb bootstrap server just before it restarts into the
        # real one - a connection landing in that gap gets dropped. Retries
        # absorb that one-time race instead of needing a manual `up` re-run.
        command: sh -c 'for i in $$(seq 1 10); do php artisan migrate --force && exit 0; sleep 3; done; exit 1'
        depends_on:
            postgres:
                condition: service_healthy

    # Syncs tracked markets from Hyperliquid and queues a full historical
    # backfill, once per deploy - this is what makes markets/history show
    # up with no manual command needed. Reuses the *app anchor for its env
    # (needs HYPERLIQUID_* and a working QUEUE_CONNECTION), but overrides
    # `restart` since a one-shot job must not restart after it exits 0.
    seed:
        <<: *app
        depends_on:
            migrate:
                condition: service_completed_successfully
        command: php artisan hyperliquid:backfill --all
        restart: 'no'

    # Serves the app on port 80 (nginx + php-fpm together in one
    # container - see Dockerfile). Stateless - safe to scale horizontally.
    app:
        <<: *app
        ports:
            - '${APP_PORT:-80}:80'

    # Processes BackfillCandlesJob/UpsertCandleJob. Safe to scale - the
    # rate-limit budget in HyperliquidClient is shared via the database
    # regardless of how many of these are running.
    queue:
        <<: *app
        command: php artisan queue:work --tries=5 --max-time=3600

    # Holds the single live WebSocket connection to Hyperliquid. Do NOT scale
    # this beyond one replica - two instances would double-subscribe and
    # double-write every live candle.
    hyperliquid-stream:
        <<: *app
        command: php artisan hyperliquid:stream

volumes:
    postgres_data:
